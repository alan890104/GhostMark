name: Bug report
description: Report a reproducible GhostMark problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private images, paths, and account details before posting.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Ghostty 1.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
